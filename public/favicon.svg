<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b9d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff8fab;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffa8cc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffe0e6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8f8f8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="32" height="32" rx="8" fill="url(#bgGrad)"/>
  
  <!-- Central heart icon -->
  <path d="M16 22c-0.5-0.5-6-4.5-6-9 0-2.5 1.5-4 3.5-4 1.5 0 2.5 1 2.5 2.5 0-1.5 1-2.5 2.5-2.5 2 0 3.5 1.5 3.5 4 0 4.5-5.5 8.5-6 9z" fill="url(#heartGrad)" stroke="#ffffff" stroke-width="0.5"/>
  
  <!-- Unified "dlove" text -->
  <text x="16" y="28" font-family="Georgia, serif" font-size="5" font-weight="bold" text-anchor="middle" fill="url(#textGrad)" letter-spacing="-0.2">DLove</text>
  
  <!-- Subtle sparkle effects -->
  <circle cx="8" cy="8" r="0.8" fill="#ffffff" opacity="0.9"/>
  <circle cx="24" cy="8" r="0.8" fill="#ffffff" opacity="0.9"/>
  <circle cx="8" cy="24" r="0.6" fill="#ffffff" opacity="0.7"/>
  <circle cx="24" cy="24" r="0.6" fill="#ffffff" opacity="0.7"/>
  
  <!-- Small hearts decoration -->
  <path d="M10 6c-0.2-0.2-1.5-1-1.5-2 0-0.5 0.3-0.8 0.7-0.8 0.3 0 0.5 0.2 0.5 0.5 0-0.3 0.2-0.5 0.5-0.5 0.4 0 0.7 0.3 0.7 0.8 0 1-1.3 1.8-1.5 2z" fill="#ffffff" opacity="0.6"/>
  <path d="M22 6c-0.2-0.2-1.5-1-1.5-2 0-0.5 0.3-0.8 0.7-0.8 0.3 0 0.5 0.2 0.5 0.5 0-0.3 0.2-0.5 0.5-0.5 0.4 0 0.7 0.3 0.7 0.8 0 1-1.3 1.8-1.5 2z" fill="#ffffff" opacity="0.6"/>
</svg>